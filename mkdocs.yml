site_name: Teaching With AI
site_description: Teaching and learning materials about and with artificial intelligence
site_url: https://taiteachingwithai.github.io/TAI/
repo_url: https://github.com/TAITeachingWithAI/TAI
repo_name: TAITeachingWithAI/TAI
edit_uri: edit/main/docs/
copyright: >
  Teaching With AI. Funded by the Erasmus+ programme of the European Union.

theme:
  name: material
  language: en
  icon:
    logo: material/school
    repo: fontawesome/brands/github
  favicon: assets/images/favicon.svg
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.action.view
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

hooks:
  - hooks/content.py

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - For Students:
      - for-students/index.md
      - "Part 1: AI & Arts and Humanities":
          - for-students/part-1-ai-arts-and-humanities/index.md
          - Art Exhibition: for-students/part-1-ai-arts-and-humanities/Exhibition/index.md
          - Art Styles: for-students/part-1-ai-arts-and-humanities/Art-styles/index.md
          - Prompting LLMs: for-students/part-1-ai-arts-and-humanities/Prompting-LLMs/index.md
          - Sound Effects: for-students/part-1-ai-arts-and-humanities/sound_effects/index.md
          - How LLMs Work: for-students/part-1-ai-arts-and-humanities/how_LLMs_work/index.md
      - "Part 2: AI & Science":
          - for-students/part-2-ai-science/index.md
          - Physics: for-students/part-2-ai-science/physics/index.md
          - Mathematics: for-students/part-2-ai-science/mathematics/index.md
          - Chemistry: for-students/part-2-ai-science/chemistry/index.md
          - Biology: for-students/part-2-ai-science/biology/index.md
          - Robotics: for-students/part-2-ai-science/robotics/index.md
          - Exoplanet Files: for-students/part-2-ai-science/exoplanet-files/index.md
      - "Part 3: AI & Everyday Life": for-students/part-3-ai-everyday-life/index.md
  - For Teachers:
      - for-teachers/index.md
      - "Part 1: AI & Arts and Humanities":
          - for-teachers/part-1-ai-arts-humanities/index.md
          - Diffusion:
              - for-teachers/part-1-ai-arts-humanities/diffusion/index.md
              - Image to Noise Examples: for-teachers/part-1-ai-arts-humanities/diffusion/image_to_noise_examples/index.md
          - Sound Effects: for-teachers/part-1-ai-arts-humanities/sound_effects/index.md
      - "Part 2: AI & Science":
          - for-teachers/part-2-ai-science/index.md
          - Physics: for-teachers/part-2-ai-science/physics/index.md
          - Mathematics:
              - for-teachers/part-2-ai-science/mathematics/index.md
              - Notebooks for the math lesson: for-teachers/part-2-ai-science/mathematics/notebooks-for-the-math-lesson/index.md
          - Chemistry: for-teachers/part-2-ai-science/chemistry/index.md
          - Biology: for-teachers/part-2-ai-science/biology/index.md
          - Robotics: for-teachers/part-2-ai-science/robotics/index.md
          - Exoplanet Files:
              - for-teachers/part-2-ai-science/exoplanet-files/index.md
              - Planet Files: for-teachers/part-2-ai-science/exoplanet-files/planet-files/index.md
              - Rover Dossiers: for-teachers/part-2-ai-science/exoplanet-files/dossiers/index.md
      - "Part 3: AI & Everyday Life": for-teachers/part-3-ai-everyday-life/index.md
  - AI Tools: tools.md
  - About: about.md
