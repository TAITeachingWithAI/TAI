          - Where LLMs fail: for-students/part-1-ai-arts-and-humanities/where-llms-fail/index.md
          - History: for-students/part-1-ai-arts-and-humanities/history/index.md
          - Languages: for-students/part-1-ai-arts-and-humanities/languages/index.md
          - Literature: for-students/part-1-ai-arts-and-humanities/literature/index.md
          - "How do Diffusion models work?": for-students/part-1-ai-arts-and-humanities/diffusion-models/index.md
          - Art Styles and image prompting: for-students/part-1-ai-arts-and-humanities/art-styles/index.md
          - Sound generation: for-students/part-1-ai-arts-and-humanities/sound-generation/index.md
