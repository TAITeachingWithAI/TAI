site_name: Teaching With AI
site_description: Teaching and learning materials about and with artificial intelligence
site_url: https://taiteachingwithai.github.io/TAI/
repo_url: https://github.com/TAITeachingWithAI/TAI
repo_name: TAITeachingWithAI/TAI
docs_dir: website
edit_uri: edit/main/website/
copyright: >
  Teaching With AI. Funded by the Erasmus+ programme of the European Union.

theme:
  name: material
  language: en
  logo: assets/images/Logo_TAI_Transparent.png
  icon:
    repo: fontawesome/brands/github
  favicon: assets/images/favicon.svg
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.action.view
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

hooks:
  - hooks/content.py

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - For Students:
